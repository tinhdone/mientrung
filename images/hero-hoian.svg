<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Minh họa phố lồng đèn Hội An soi bóng xuống sông Hoài về đêm, có thuyền thả đèn hoa đăng</title>
